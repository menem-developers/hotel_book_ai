name: Deploy FastAPI to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.LIGHTSAIL_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to EC2 / Lightsail
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} << 'EOF'
            set -e

            echo "🔹 Starting deployment..."

            # Trust GitHub host
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            chmod 644 ~/.ssh/known_hosts

            # Install Docker if missing
            if ! command -v docker &> /dev/null; then
              echo "Docker not found, installing..."
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            # Show disk usage before deployment
            echo "🔹 Disk usage before cleanup:"
            df -h
            sudo docker system df || true

            # Clone or update repository
            if [ ! -d ~/fastapi-app ]; then
              echo "🔹 Cloning repository..."
              git clone git@github.com:menem-developers/hotel_book_ai.git ~/fastapi-app || git clone https://github.com/menem-developers/hotel_book_ai.git ~/fastapi-app
            else
              echo "🔹 Updating repository..."
              cd ~/fastapi-app
              git fetch origin
              git reset --hard origin/main
            fi

            cd ~/fastapi-app

            # Build new Docker image first (ensures zero downtime if build fails)
            echo "🔹 Building Docker image..."
            sudo docker build -t fastapi-app:latest .

            # Stop and remove old container
            echo "🔹 Stopping old container..."
            sudo docker stop fastapi-app || true
            sudo docker rm fastapi-app || true

            # Prepare persistent uploads directory
            mkdir -p ~/fastapi-app/uploads

            # Check for .env file
            ENV_FLAG=""
            if [ -f .env ]; then
              echo "🔹 Loading environment variables from .env"
              ENV_FLAG="--env-file .env"
            fi

            # Run new container
            echo "🔹 Starting FastAPI container..."
            sudo docker run -d \
              --name fastapi-app \
              --restart unless-stopped \
              --add-host=host.docker.internal:host-gateway \
              $ENV_FLAG \
              -v ~/fastapi-app/uploads:/app/uploads \
              -p 8000:8000 \
              fastapi-app:latest

            # Health verification
            echo "🔹 Verifying container status..."
            sleep 5
            if ! sudo docker ps --filter "name=fastapi-app" --filter "status=running" | grep -q fastapi-app; then
              echo "❌ Error: Container failed to start!"
              sudo docker logs --tail 50 fastapi-app
              exit 1
            fi

            # Cleanup unused Docker resources
            echo "🔹 Cleaning unused Docker resources..."
            sudo docker image prune -f
            sudo docker builder prune -af

            echo "🔹 Final disk usage:"
            df -h
            sudo docker system df || true

            echo "✅ Deployment completed successfully!"
            sudo docker ps --filter "name=fastapi-app"
          EOF
